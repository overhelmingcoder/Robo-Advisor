services:
  - type: web
    name: robo-advisor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: OPENROUTER_TIMEOUT
        value: "30"
      - key: OPENROUTER_MAX_ITER
        value: "2"
      - key: OPENROUTER_TEMP
        value: "0.0"
      - key: OPENROUTER_CACHE_TTL
        value: "300"
      - key: FAST_RETURN
        value: "1"
      - key: FAST_ENRICH
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
