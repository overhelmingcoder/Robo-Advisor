services:
  - type: web
    name: robo-advisor-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: AI_MODEL_FALLBACKS
        value: nvidia/nemotron-3-super-120b-a12b:free,openai/gpt-oss-120b:free,google/gemma-4-31b-it:free
      - key: OPENROUTER_TIMEOUT
        value: "60"
      - key: OPENROUTER_MAX_ITER
        value: "1"
      - key: OPENROUTER_MAX_TOKENS
        value: "900"
      - key: CHAT_MAX_TOKENS
        value: "450"
      - key: OPENROUTER_TEMP
        value: "0.0"
      - key: OPENROUTER_CACHE_TTL
        value: "300"
      - key: APP_TITLE
        value: Bangladesh Robo-Advisor
      - key: FAST_RETURN
        value: "1"
      - key: FAST_ENRICH
        value: "0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
